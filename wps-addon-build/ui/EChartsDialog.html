<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>ECharts 图表预览</title>
<script src="../js/util.js"></script>
<script src="../js/echarts.min.js"></script>
<script src="../js/EChartsTaskPane.js"></script>
<script src="../js/EChartsDialog.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; font-size: 13px; }
  body { display: flex; flex-direction: column; background: #fafafa; overflow: hidden; }
  #chart { flex: 1 1 auto; min-height: 300px; height: 300px; width: 100%; background: #fff; }
  #topbar {
    padding: 6px 10px; background: #f0f4f8; border-bottom: 1px solid #d0d7de;
    font-size: 12px; color: #555; display: flex; justify-content: space-between; align-items: center;
  }
  #topbar .chart-info { font-weight: 600; color: #333; }
  #topbar .chart-status { color: #888; font-size: 11px; }
  #toolbar {
    padding: 6px 10px; background: #fff; border-top: 1px solid #d0d7de;
    display: flex; gap: 6px; justify-content: flex-end;
  }
  #toolbar button {
    padding: 5px 12px; border: 1px solid #aaa; background: #fafafa;
    border-radius: 3px; cursor: pointer; font-size: 12px;
  }
  #toolbar button:hover { background: #eaf3ff; border-color: #4a90e2; }
  #toolbar button.primary { background: #4a90e2; color: #fff; border-color: #3070c0; }
  #toolbar button.primary:hover { background: #3070c0; }
  #status {
    padding: 4px 10px; font-size: 11px; color: #555;
    background: #f8f8f8; border-top: 1px solid #e0e0e0;
    min-height: 18px;
  }
  #status.ok { color: #2e8534; }
  #status.warn { color: #b07000; }
  #status.fail { color: #c00; }
</style>
</head>
<body>
  <div id="topbar">
    <span class="chart-info" id="chartInfo">尚未渲染</span>
    <span class="chart-status" id="chartStatus"></span>
  </div>
  <div id="chart"></div>
  <div id="status">就绪。</div>
  <div id="toolbar">
    <button type="button" onclick="EChartsDialog.refresh()">刷新</button>
    <button type="button" onclick="EChartsDialog.exportLocal()">保存图片</button>
    <button type="button" onclick="EChartsDialog.exportToSheet()">插入表格</button>
    <button type="button" class="primary" onclick="EChartsDialog.closeSelf()">关闭</button>
  </div>
</body>
</html>
